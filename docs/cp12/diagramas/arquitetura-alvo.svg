<text x="568" y="329" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">Backend — FastAPI (Python)</text>
<text x="568" y="351" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">• Ingestão: assina e valida cada mensagem</text>
<text x="568" y="369" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">   contra o contrato; inválida é descartada</text>
<text x="568" y="387" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">   e registrada</text>
<text x="568" y="405" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">• Motor de regras e agendamento</text>
<text x="568" y="423" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">• API REST + autenticação (login/JWT)</text>
<text x="568" y="441" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">• ÚNICO que publica comandos</text>
<text x="568" y="459" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">• Notificador externo · servidor de OTA</text>
