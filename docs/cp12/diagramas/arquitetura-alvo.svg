<text x="38" y="396" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">ESP32 · deviceId próprio</text>
<text x="38" y="414" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Entradas: reed MC-38 · PIR</text>
<text x="38" y="432" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Saídas: buzzer · LED de status</text>
<text x="38" y="450" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Mesmo firmware, outro deviceId</text>
<text x="38" y="468" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">(R13: 2 dispositivos físicos)</text>
