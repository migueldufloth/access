<rect x="20" y="110" width="6" height="195" rx="3" fill="#2F3C7E"/>
<text x="38" y="134" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">Dispositivo A — porta</text>
<text x="38" y="156" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">ESP32 · deviceId derivado do MAC</text>
<text x="38" y="174" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Entradas: reed MC-38 · botão</text>
<text x="38" y="192" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">           armar/desarmar</text>
<text x="38" y="210" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Saídas: buzzer · LED de status ·</text>
<text x="38" y="228" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">           OLED</text>
<text x="38" y="246" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Firmware: regra local sem rede,</text>
<text x="38" y="264" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">config. em NVS, OTA</text>
