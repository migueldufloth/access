<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif">
<title id="t">Arquitetura-alvo do Access (N3)</title>
<desc id="d">Diagrama de blocos: dois ESP32 falam MQTT com TLS com o broker; o backend assina os tópicos, valida, grava no PostgreSQL, aplica regras, notifica pelo Telegram e é o único a publicar comandos; a interface web fala apenas com a API do backend.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1F2A"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#990011"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
</defs>
<rect width="1280" height="760" fill="#FFFFFF"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#2F3C7E" text-anchor="start">Arquitetura-alvo — Access (N3)</text>
<text x="20" y="52" font-size="12.5" font-weight="400" fill="#5B6275" text-anchor="start">Diagrama de blocos. Tecnologias de servidor são a proposta inicial (CP12) e serão fechadas na Seção 7.</text>
