<text x="520" y="92" font-size="12" font-weight="700" fill="#5B6275" text-anchor="start">SERVIDOR — sobe com um único comando (Docker Compose)</text>
<text x="1060" y="92" font-size="12" font-weight="700" fill="#5B6275" text-anchor="start">USUÁRIO</text>
