<text x="568" y="149" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">Mosquitto — broker MQTT</text>
<text x="568" y="171" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">autenticação + ACL por dispositivo</text>
<text x="568" y="189" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Last Will: status online/offline</text>
<text x="568" y="207" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">contrato versionado (CONTRATOS.md)</text>
