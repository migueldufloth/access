<text x="1015" y="442" font-size="11.5" font-weight="600" fill="#2E7D32" text-anchor="middle">API Bot</text>
<text x="1060" y="482" font-size="12" font-weight="700" fill="#990011" text-anchor="start">Não fala com o broker.</text>
<text x="1060" y="500" font-size="12" font-weight="700" fill="#990011" text-anchor="start">Só com a API.</text>
<rect x="20" y="675" width="1240" height="70" rx="8" fill="#F4F6FB" stroke="#8A93AD"/>
<text x="38" y="699" font-size="12.5" font-weight="700" fill="#2F3C7E" text-anchor="start">Como ler:</text>
<text x="110" y="699" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">linha cheia = fluxo normal · tracejado azul = ambiente Docker Compose (broker, backend, banco) · selo âmbar = hardware ainda a adquirir</text>
<text x="38" y="723" font-size="12.5" font-weight="700" fill="#2F3C7E" text-anchor="start">OTA:</text>
<text x="110" y="723" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">o backend publica o comando de atualização via MQTT e o dispositivo baixa o binário por HTTPS (modelo pull, já que o ESP32 não fica na LAN do servidor).</text>
