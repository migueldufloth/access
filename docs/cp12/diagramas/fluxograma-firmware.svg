<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif"><title id="t">Fluxograma do firmware — Access N3</title><desc id="d">Máquina de estados do firmware: modos automático, manual e seguro; estados do alarme desarmado, armado, entrada e alarme; intertravamentos e persistência em NVS.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F3C7E"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#990011"/></marker></defs><rect width="1400" height="960" fill="#F4F6FB"/><text x="40" y="44" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" fill="#2F3C7E" font-weight="700" text-anchor="start">Access · Fluxograma do firmware (design — a implementação no ESP32 pode ajustar detalhes)</text><text x="40" y="90" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#2F3C7E" font-weight="700" text-anchor="start">1. Modos de operação</text><rect x="40" y="100" width="1320" height="290" rx="8" fill="#fff" stroke="#8A93AD" stroke-width="1.5"/><rect x="190" y="200" width="280" height="110" rx="14" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="2.5"/><text x="330.0" y="228" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#2F3C7E" font-weight="700" text-anchor="middle">AUTOMÁTICO</text><text x="330.0" y="250" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">Agendamento e regra remota (backend) atuam.</text><text x="330.0" y="264" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">Regra local sempre ativa, com ou sem rede.</text><rect x="640" y="200" width="280" height="110" rx="14" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="2.5"/><text x="780.0" y="228" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#2F3C7E" font-weight="700" text-anchor="middle">MANUAL</text><text x="780.0" y="250" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">Usuário assumiu o controle (botão ou painel).</text><text x="780.0" y="264" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">Agendamento recusado: E_MODO_MANUAL.</text><rect x="1070" y="200" width="260" height="110" rx="14" fill="#F4F6FB" stroke="#990011" stroke-width="2.5"/><text x="1200.0" y="228" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#990011" font-weight="700" text-anchor="middle">SEGURO</text><text x="1200.0" y="250" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">Sensor com falha: bipe de falha,</text><text x="1200.0" y="264" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">armar recusado (E_SENSOR_FALHA).</text><circle cx="70" cy="255" r="8" fill="#1B1F2A"/><polyline points="78,255 186,255" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="75" y="232" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="700" text-anchor="start">boot</text><text x="132" y="276" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" fill="#5B6275" font-weight="400" text-anchor="middle">lê NVS · atuadores</text><text x="132" y="288" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" fill="#5B6275" font-weight="400" text-anchor="middle">desligados</text><polyline points="470,235 636,235" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="553" y="226" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">botão físico ou comando</text><text x="553" y="213" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">origem = usuário</text><polyline points="636,285 470,285" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="553" y="302" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">timeout 1800 s sem novo</text><text x="553" y="315" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">comando (timeoutManual_s)</text><polyline points="920,255 1066,255" fill="none" stroke="#990011" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrg)"/><text x="993" y="246" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">falha de sensor</text><text x="993" y="272" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">> 3 s</text><polyline points="330,200 330,150 1200,150 1200,196" fill="none" stroke="#990011" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrg)"/><text x="765" y="142" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">falha de sensor (curto ou fio rompido) por mais de 3 s — vale também em MANUAL</text><polyline points="1200,310 1200,350 330,350 330,314" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="765" y="368" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">sensor normal por ≥ 3 s (volta ao AUTOMÁTICO)</text><text x="40" y="432" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#2F3C7E" font-weight="700" text-anchor="start">2. Estados do alarme — regra local, roda em qualquer modo e sem rede</text><rect x="40" y="442" width="1320" height="380" rx="8" fill="#fff" stroke="#8A93AD" stroke-width="1.5"/><rect x="60" y="560" width="200" height="90" rx="14" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="2.5"/><text x="160" y="596" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#2F3C7E" font-weight="700" text-anchor="middle">DESARMADO</text><text x="160" y="618" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">sirene e LED de alerta off</text><rect x="380" y="560" width="200" height="90" rx="14" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="2.5"/><text x="480" y="596" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#2F3C7E" font-weight="700" text-anchor="middle">ARMADO</text><text x="480" y="618" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">LED aceso · vigiando</text><rect x="700" y="560" width="200" height="90" rx="14" fill="#F4F6FB" stroke="#B26A00" stroke-width="2.5"/><text x="800" y="596" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#B26A00" font-weight="700" text-anchor="middle">ENTRADA</text><text x="800" y="618" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">contagem regressiva</text><rect x="1020" y="560" width="200" height="90" rx="14" fill="#F4F6FB" stroke="#990011" stroke-width="2.5"/><text x="1120" y="596" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#990011" font-weight="700" text-anchor="middle">ALARME</text><text x="1120" y="618" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">sirene + alerta</text><polyline points="260,585 376,585" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="318" y="574" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="700" text-anchor="middle">armar</text><text x="318" y="560" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" fill="#5B6275" font-weight="400" text-anchor="middle">[porta fechada, sensor ok]</text><polyline points="376,625 260,625" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="318" y="641" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">desarmar / botão</text><polyline points="580,600 696,600" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="638" y="588" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="700" text-anchor="middle">abertura</text><text x="638" y="616" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" fill="#5B6275" font-weight="400" text-anchor="middle">debounce 50 ms</text><polyline points="900,600 1016,600" fill="none" stroke="#990011" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrg)"/><text x="958" y="586" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="700" text-anchor="middle">tempoEntrada_s</text><text x="958" y="616" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="10" fill="#5B6275" font-weight="400" text-anchor="middle">(20 s) sem desarme</text><polyline points="500,560 500,520 1080,520 1080,556" fill="none" stroke="#990011" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrg)"/><text x="790" y="512" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">disparar (remoto) — só se ARMADO; senão rejeita E_DESARMADO</text><polyline points="1180,560 1180,482 440,482 440,556" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="790" y="474" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">silenciar — sirene off, continua ARMADO</text><polyline points="800,650 800,700 160,700 160,654" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="480" y="692" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">desarmar / botão antes do fim da contagem</text><polyline points="1120,650 1120,740 120,740 120,654" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="620" y="756" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="middle">desarmar / botão</text><rect x="40" y="772" width="0" height="0" rx="6" fill="#fff" stroke="#1B1F2A" stroke-width="2"/><text x="40" y="850" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#2F3C7E" font-weight="700" text-anchor="start">Intertravamentos</text><text x="40" y="868" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="start">disparar só em ARMADO · armar só com porta fechada e sensor ok · agendamento recusado em MANUAL · comando repetido (mesmo commandId) não reexecuta.</text><text x="40" y="890" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#2F3C7E" font-weight="700" text-anchor="start">Persistência (NVS) e boot</text><text x="40" y="908" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="start">Guardados: armado, tempoEntrada_s, intervaloTelemetria_s, timeoutManual_s. Boot restaura ARMADO se estava armado (a entrada conta a partir do boot).</text><text x="40" y="924" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#1B1F2A" font-weight="400" text-anchor="start">Sirene e buzzer sempre iniciam desligados. O boot não depende de rede: SNTP em segundo plano, com ts = null até sincronizar.</text></svg>
