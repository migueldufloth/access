<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif">
<title id="t">Fluxo do dado do Access (N3)</title>
<desc id="d">Sensor, firmware, MQTT, backend, banco e interface, com validação no firmware e no backend, e ramo de regra que gera alerta e notificação.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1F2A"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#990011"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
</defs>
<rect width="1280" height="500" fill="#FFFFFF"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#2F3C7E" text-anchor="start">Fluxo do dado — sensor → firmware → MQTT → backend → banco → interface</text>
<text x="20" y="52" font-size="12.5" font-weight="400" fill="#5B6275" text-anchor="start">Cada etapa indica o que acontece com a medição. Mensagem inválida nunca chega ao banco de medições.</text>
<rect x="20" y="100" width="160" height="205" rx="8" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="1.6"/>
<rect x="20" y="100" width="6" height="205" rx="3" fill="#2F3C7E"/>
<text x="38" y="124" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">1. Sensor</text>
<text x="38" y="146" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">reed MC-38 (aberta/</text>
<text x="38" y="165" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">fechada) e PIR</text>
<text x="38" y="184" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">(presença) no pino</text>
<text x="38" y="203" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">digital do ESP32.</text>
<polyline points="180,202.5 236,202.5" fill="none" stroke="#1B1F2A" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="236" y="100" width="160" height="205" rx="8" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="1.6"/>
<rect x="236" y="100" width="6" height="205" rx="3" fill="#2F3C7E"/>
<text x="254" y="124" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">2. Firmware</text>
<text x="254" y="146" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Leitura não bloqueante.</text>
<text x="254" y="165" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Debounce 50 ms e</text>
<text x="254" y="184" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">validação (valor-</text>
<text x="254" y="203" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">sentinela). Regra local.</text>
<text x="254" y="222" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Monta JSON v1 com</text>
<text x="254" y="241" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">deviceId, timestamp</text>
<text x="254" y="260" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">e unidade.</text>
<polyline points="396,202.5 452,202.5" fill="none" stroke="#1B1F2A" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="452" y="100" width="160" height="205" rx="8" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="1.6"/>
<rect x="452" y="100" width="6" height="205" rx="3" fill="#2F3C7E"/>
<text x="470" y="124" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">3. MQTT</text>
<text x="470" y="146" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">publish em</text>
<text x="470" y="165" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">access/grupo5/</text>
<text x="470" y="184" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">&lt;deviceId&gt;/telemetria</text>
<text x="470" y="203" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">(evento + periódica</text>
<text x="470" y="222" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">5 s). QoS 1 nos</text>
<text x="470" y="241" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">eventos.</text>
<text x="470" y="260" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">LWT: status.</text>
<polyline points="612,202.5 668,202.5" fill="none" stroke="#1B1F2A" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="668" y="100" width="160" height="205" rx="8" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="1.6"/>
<rect x="668" y="100" width="6" height="205" rx="3" fill="#2F3C7E"/>
<text x="686" y="124" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">4. Backend</text>
<text x="686" y="146" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Assina os tópicos.</text>
<text x="686" y="165" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Valida contra o</text>
<text x="686" y="184" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">contrato. Inválida:</text>
<text x="686" y="203" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">descarta e registra.</text>
<text x="686" y="222" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Válida: persiste.</text>
<text x="686" y="241" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Avalia regras.</text>
<polyline points="828,202.5 884,202.5" fill="none" stroke="#1B1F2A" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="884" y="100" width="160" height="205" rx="8" fill="#F4F6FB" stroke="#2F3C7E" stroke-width="1.6"/>
<rect x="884" y="100" width="6" height="205" rx="3" fill="#2F3C7E"/>
<text x="902" y="124" font-size="14.5" font-weight="700" fill="#2F3C7E" text-anchor="start">5. Banco</text>
<text x="902" y="146" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">INSERT em medições</text>
<text x="902" y="165" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">(dispositivo, grandeza,</text>
<text x="902" y="184" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">valor, unidade,</text>
<text x="902" y="203" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">timestamp). Atualiza</text>
<text x="902" y="222" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">último contato e</text>
<text x="902" y="241" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">online/offline.</text>
<polyline points="1044,202.5 1100,202.5" fill="none" stroke="#1B1F2A" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="1100" y="100" width="160" height="205" rx="8" fill="#F4F6FB" stroke="#2E7D32" stroke-width="1.6"/>
<rect x="1100" y="100" width="6" height="205" rx="3" fill="#2E7D32"/>
<text x="1118" y="124" font-size="14.5" font-weight="700" fill="#2E7D32" text-anchor="start">6. Interface</text>
<text x="1118" y="146" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">GET estado atual,</text>
<text x="1118" y="165" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">histórico e alertas.</text>
<text x="1118" y="184" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">Mostra valor com</text>
<text x="1118" y="203" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">unidade, último</text>
<text x="1118" y="222" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">contato, online/</text>
<text x="1118" y="241" font-size="12.3" font-weight="400" fill="#1B1F2A" text-anchor="start">offline e gráficos.</text>
<polyline points="715,305 715,360" fill="none" stroke="#990011" stroke-width="1.8" marker-end="url(#ahr)" stroke-linejoin="round"/>
<rect x="500" y="360" width="230" height="90" rx="8" fill="#F4F6FB" stroke="#990011" stroke-width="1.6"/>
<rect x="500" y="360" width="6" height="90" rx="3" fill="#990011"/>
<text x="518" y="384" font-size="14.5" font-weight="700" fill="#990011" text-anchor="start">Mensagem inválida</text>
<text x="518" y="406" font-size="12" font-weight="400" fill="#1B1F2A" text-anchor="start">registrada em mensagens_</text>
<text x="518" y="423" font-size="12" font-weight="400" fill="#1B1F2A" text-anchor="start">invalidas (motivo + payload);</text>
<text x="518" y="440" font-size="12" font-weight="400" fill="#1B1F2A" text-anchor="start">não vira medição.</text>
<polyline points="790,305 790,360" fill="none" stroke="#B26A00" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="770" y="360" width="300" height="90" rx="8" fill="#F4F6FB" stroke="#B26A00" stroke-width="1.6"/>
<rect x="770" y="360" width="6" height="90" rx="3" fill="#B26A00"/>
<text x="788" y="384" font-size="14.5" font-weight="700" fill="#B26A00" text-anchor="start">Regra dispara → alerta</text>
<text x="788" y="406" font-size="12" font-weight="400" fill="#1B1F2A" text-anchor="start">grava o alerta no banco, mostra na</text>
<text x="788" y="423" font-size="12" font-weight="400" fill="#1B1F2A" text-anchor="start">interface e notifica no Telegram</text>
<text x="788" y="440" font-size="12" font-weight="400" fill="#1B1F2A" text-anchor="start">(Seção 3: R8 e R15).</text>
<text x="20" y="372" font-size="13" font-weight="700" fill="#2F3C7E" text-anchor="start">Sem rede:</text>
<text x="20" y="392" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">o firmware continua</text>
<text x="20" y="410" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">aplicando a regra local</text>
<text x="20" y="428" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">(armado + abertura →</text>
<text x="20" y="446" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">buzzer/LED) e volta a</text>
<text x="20" y="464" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">publicar quando a rede volta.</text>
</svg>
