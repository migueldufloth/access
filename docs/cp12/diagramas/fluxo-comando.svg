<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Fluxo do comando do Access (N3)</title>
<desc id="d">Diagrama de sequência: interface, backend, broker MQTT, firmware e atuador. O comando passa pelos estados enviado, recebido, executado e confirmado; um comando proibido é rejeitado com motivo.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B1F2A"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#990011"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
</defs>
<rect width="1280" height="800" fill="#FFFFFF"/>
<text x="20" y="32" font-size="20" font-weight="700" fill="#2F3C7E" text-anchor="start">Fluxo do comando — interface → backend → MQTT → firmware → atuador → confirmação</text>
<text x="20" y="52" font-size="12.5" font-weight="400" fill="#5B6275" text-anchor="start">Estados registrados no banco por commandId: enviado → recebido → executado → confirmado (ou rejeitado, com motivo; ou sem resposta).</text>
<rect x="50" y="80" width="160" height="34" rx="8" fill="#2E7D32"/>
<text x="130" y="102" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Interface web</text>
<line x1="130" y1="114" x2="130" y2="680" stroke="#8A93AD" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="310" y="80" width="160" height="34" rx="8" fill="#2F3C7E"/>
<text x="390" y="102" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backend</text>
<line x1="390" y1="114" x2="390" y2="680" stroke="#8A93AD" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="570" y="80" width="160" height="34" rx="8" fill="#2F3C7E"/>
<text x="650" y="102" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Broker MQTT</text>
<line x1="650" y1="114" x2="650" y2="680" stroke="#8A93AD" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="830" y="80" width="160" height="34" rx="8" fill="#2F3C7E"/>
<text x="910" y="102" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Firmware (ESP32)</text>
<line x1="910" y1="114" x2="910" y2="680" stroke="#8A93AD" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="1080" y="80" width="160" height="34" rx="8" fill="#2F3C7E"/>
<text x="1160" y="102" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Atuador</text>
<line x1="1160" y1="114" x2="1160" y2="680" stroke="#8A93AD" stroke-width="1.4" stroke-dasharray="5 5"/>
<polyline points="130,150 390,150" fill="none" stroke="#1B1F2A" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="146" cy="136" r="11" fill="#1B1F2A"/>
<text x="146" y="140" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="166" y="141" font-size="12.5" font-weight="600" fill="#1B1F2A" text-anchor="start">POST /comandos (usuário autenticado)</text>
<text x="166" y="166" font-size="11.5" font-weight="400" fill="#5B6275" text-anchor="start">valida login e permissão</text>
<polyline points="390,215 650,215" fill="none" stroke="#2F3C7E" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="406" cy="201" r="11" fill="#2F3C7E"/>
<text x="406" y="205" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="426" y="206" font-size="12.5" font-weight="600" fill="#2F3C7E" text-anchor="start">publica comando + commandId (QoS 1)</text>
<text x="426" y="231" font-size="11.5" font-weight="400" fill="#5B6275" text-anchor="start">grava estado ENVIADO</text>
<polyline points="650,280 910,280" fill="none" stroke="#2F3C7E" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="666" cy="266" r="11" fill="#2F3C7E"/>
<text x="666" y="270" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="686" y="271" font-size="12.5" font-weight="600" fill="#2F3C7E" text-anchor="start">entrega o comando ao dispositivo</text>
<rect x="790" y="300" width="240" height="56" rx="8" fill="#FFF7E6" stroke="#B26A00"/>
<text x="910" y="321" font-size="11.8" font-weight="600" fill="#B26A00" text-anchor="middle">Firmware valida: faixa do valor,</text>
<text x="910" y="337" font-size="11.8" font-weight="600" fill="#B26A00" text-anchor="middle">intertravamento e commandId repetido</text>
<polyline points="910,395 650,395" fill="none" stroke="#2F3C7E" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="666" cy="381" r="11" fill="#2F3C7E"/>
<text x="666" y="385" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="686" y="386" font-size="12.5" font-weight="600" fill="#2F3C7E" text-anchor="start">confirmação RECEBIDO (aceito)</text>
<text x="686" y="411" font-size="11.5" font-weight="400" fill="#5B6275" text-anchor="start">commandId + resultado</text>
<polyline points="910,455 1160,455" fill="none" stroke="#2F3C7E" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="926" cy="441" r="11" fill="#2F3C7E"/>
<text x="926" y="445" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="946" y="446" font-size="12.5" font-weight="600" fill="#2F3C7E" text-anchor="start">aciona o atuador (buzzer/LED)</text>
<text x="946" y="471" font-size="11.5" font-weight="400" fill="#5B6275" text-anchor="start">estado EXECUTADO</text>
<polyline points="910,520 650,520" fill="none" stroke="#2F3C7E" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="666" cy="506" r="11" fill="#2F3C7E"/>
<text x="666" y="510" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="686" y="511" font-size="12.5" font-weight="600" fill="#2F3C7E" text-anchor="start">publica estado + confirmação final</text>
<text x="686" y="536" font-size="11.5" font-weight="400" fill="#5B6275" text-anchor="start">commandId, resultado, timestamp</text>
<polyline points="650,580 390,580" fill="none" stroke="#2F3C7E" stroke-width="1.8" marker-end="url(#ah)" stroke-linejoin="round"/>
<circle cx="406" cy="566" r="11" fill="#2F3C7E"/>
<text x="406" y="570" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="426" y="571" font-size="12.5" font-weight="600" fill="#2F3C7E" text-anchor="start">grava estado CONFIRMADO</text>
<text x="426" y="596" font-size="11.5" font-weight="400" fill="#5B6275" text-anchor="start">backend assina o tópico</text>
<polyline points="390,640 130,640" fill="none" stroke="#2E7D32" stroke-width="1.8" marker-end="url(#ahg)" stroke-linejoin="round"/>
<circle cx="146" cy="626" r="11" fill="#2E7D32"/>
<text x="146" y="630" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="166" y="631" font-size="12.5" font-weight="600" fill="#2E7D32" text-anchor="start">mostra estados até CONFIRMADO</text>
<text x="166" y="656" font-size="11.5" font-weight="400" fill="#5B6275" text-anchor="start">(consulta a API / eventos)</text>
<rect x="20" y="700" width="1240" height="84" rx="8" fill="#F4F6FB" stroke="#990011"/>
<text x="38" y="724" font-size="12.5" font-weight="700" fill="#990011" text-anchor="start">Caminho de rejeição:</text>
<text x="190" y="724" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">no passo 4 o firmware responde RECEBIDO com resultado “rejeitado” e um código de erro (ex.: SISTEMA_DESARMADO para</text>
<text x="38" y="744" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">“disparar” com o sistema desarmado, COMANDO_DUPLICADO, VALOR_FORA_DA_FAIXA). O passo 5 não acontece e a interface exibe o motivo.</text>
<text x="38" y="764" font-size="12.5" font-weight="400" fill="#1B1F2A" text-anchor="start">Sem resposta em N segundos o backend marca o comando como SEM_RESPOSTA — a interface nunca mostra “executado” antes da confirmação do dispositivo.</text>
</svg>
