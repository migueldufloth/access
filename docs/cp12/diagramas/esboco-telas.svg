<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif"><title id="t">Esboço das telas — Access</title><desc id="d">Esboço das telas da interface web: login, painel por dispositivo com histórico e alertas, e envio de comando com estados.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F3C7E"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#990011"/></marker></defs><rect width="1400" height="780" fill="#F4F6FB"/><text x="40" y="44" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="20" fill="#2F3C7E" font-weight="700" text-anchor="start">Access · Esboço das telas (wireframe — identidade visual final na Unidade 3)</text><rect x="40" y="70" width="300" height="340" rx="10" fill="#fff" stroke="#2F3C7E" stroke-width="2.5"/><text x="190" y="98" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#2F3C7E" font-weight="700" text-anchor="middle">1 · Login</text><rect x="60" y="112" width="260" height="28" rx="4" fill="#F4F6FB" stroke="#8A93AD" stroke-width="1.5"/><text x="70" y="131" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#2F3C7E" font-weight="700" text-anchor="start">ACCESS</text><text x="190" y="190" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" fill="#1B1F2A" font-weight="700" text-anchor="middle">Entrar</text><rect x="70" y="210" width="240" height="32" rx="4" fill="#F4F6FB" stroke="#8A93AD" stroke-width="1.5"/><text x="80" y="231" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#5B6275" font-weight="400" text-anchor="start">usuário</text><rect x="70" y="256" width="240" height="32" rx="4" fill="#F4F6FB" stroke="#8A93AD" stroke-width="1.5"/><text x="80" y="277" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#5B6275" font-weight="400" text-anchor="start">senha</text><rect x="70" y="304" width="240" height="36" rx="4" fill="#2F3C7E" stroke="#2F3C7E" stroke-width="1"/><text x="190" y="327" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">Entrar</text><text x="190" y="372" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">Perfis: operador (só vê) · administrador (comanda)</text><rect x="380" y="70" width="980" height="480" rx="10" fill="#fff" stroke="#2F3C7E" stroke-width="2.5"/><rect x="380" y="70" width="980" height="34" rx="10" fill="#2F3C7E" stroke="#2F3C7E" stroke-width="1"/><text x="396" y="93" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#fff" font-weight="700" text-anchor="start">ACCESS · Painel</text><text x="1344" y="93" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="400" text-anchor="end">admin ▾</text><text x="396" y="126" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" fill="#2F3C7E" font-weight="700" text-anchor="start">2 · Painel</text><rect x="396" y="140" width="460" height="110" rx="8" fill="#F4F6FB" stroke="#2E7D32" stroke-width="2"/><text x="410" y="166" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#1B1F2A" font-weight="700" text-anchor="start">porta-01</text><text x="842" y="166" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" font-weight="700" text-anchor="end">ONLINE · ARMADO</text><text x="410" y="190" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">Porta: FECHADA · aberturas hoje: 12</text><text x="410" y="208" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">último contato há 3 s · RSSI −52 dBm</text><rect x="410" y="218" width="80" height="24" rx="4" fill="#2F3C7E" stroke="#2F3C7E" stroke-width="1"/><text x="450" y="235" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Armar</text><rect x="500" y="218" width="90" height="24" rx="4" fill="#fff" stroke="#2F3C7E" stroke-width="1.5"/><text x="545" y="235" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#2F3C7E" font-weight="700" text-anchor="middle">Desarmar</text><rect x="600" y="218" width="90" height="24" rx="4" fill="#fff" stroke="#990011" stroke-width="1.5"/><text x="645" y="235" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#990011" font-weight="700" text-anchor="middle">Disparar</text><rect x="876" y="140" width="460" height="110" rx="8" fill="#F4F6FB" stroke="#2E7D32" stroke-width="2"/><text x="890" y="166" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#1B1F2A" font-weight="700" text-anchor="start">janela-01</text><text x="1322" y="166" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32" font-weight="700" text-anchor="end">ONLINE · DESARMADO</text><text x="890" y="190" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">Janela: FECHADA · presença: não</text><text x="890" y="208" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">último contato há 4 s · RSSI −61 dBm</text><rect x="890" y="218" width="80" height="24" rx="4" fill="#2F3C7E" stroke="#2F3C7E" stroke-width="1"/><text x="930" y="235" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Armar</text><rect x="980" y="218" width="90" height="24" rx="4" fill="#fff" stroke="#2F3C7E" stroke-width="1.5"/><text x="1025" y="235" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#2F3C7E" font-weight="700" text-anchor="middle">Desarmar</text><rect x="1080" y="218" width="90" height="24" rx="4" fill="#fff" stroke="#990011" stroke-width="1.5"/><text x="1125" y="235" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#990011" font-weight="700" text-anchor="middle">Disparar</text><rect x="396" y="262" width="948" height="34" rx="6" fill="#FDECEA" stroke="#990011" stroke-width="1.5"/><text x="410" y="284" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#990011" font-weight="700" text-anchor="start">● ALERTA ATIVO — porta-01 aberta com sistema armado há 38 s (escalonamento em 22 s)</text><rect x="396" y="310" width="600" height="226" rx="6" fill="#F4F6FB" stroke="#8A93AD" stroke-width="1.5"/><text x="410" y="332" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="700" text-anchor="start">Aberturas por hora (barras) + média móvel 3 h (linha)</text><rect x="420" y="480" width="36" height="40" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="476" y="450" width="36" height="70" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="532" y="490" width="36" height="30" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="588" y="425" width="36" height="95" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="644" y="460" width="36" height="60" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="700" y="410" width="36" height="110" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="756" y="445" width="36" height="75" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="812" y="470" width="36" height="50" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="868" y="435" width="36" height="85" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><rect x="924" y="475" width="36" height="45" rx="2" fill="#C9CFEA" stroke="#2F3C7E" stroke-width="1"/><polyline points="438,470 494,440 550,450 606,420 662,428 718,410 774,420 830,432 886,424 942,436" fill="none" stroke="#990011" stroke-width="2" stroke-linejoin="round"/><rect x="1010" y="310" width="334" height="226" rx="6" fill="#F4F6FB" stroke="#8A93AD" stroke-width="1.5"/><text x="1024" y="332" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="700" text-anchor="start">Indicadores (24 h)</text><text x="1024" y="358" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">Uptime porta-01 ........ 99,2 %</text><text x="1024" y="380" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">Uptime janela-01 ....... 97,8 %</text><text x="1024" y="402" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">Tempo em alarme ........ 4 min 12 s</text><text x="1024" y="424" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">Aberturas .............. 41</text><text x="1024" y="446" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#1B1F2A" font-weight="400" text-anchor="start">Comandos ............... 9 (1 rejeitado)</text><rect x="40" y="580" width="1320" height="170" rx="10" fill="#fff" stroke="#2F3C7E" stroke-width="2.5"/><text x="56" y="606" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#2F3C7E" font-weight="700" text-anchor="start">3 · Comando em andamento — porta-01 · disparar</text><rect x="70" y="628" width="250" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="195" y="652" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" font-weight="700" text-anchor="middle">✔ enviado</text><text x="195" y="672" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">backend registrou</text><polyline points="322,656 368,656" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="370" y="628" width="250" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="495" y="652" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" font-weight="700" text-anchor="middle">✔ recebido</text><text x="495" y="672" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">dispositivo aceitou</text><polyline points="622,656 668,656" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="670" y="628" width="250" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/><text x="795" y="652" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#2E7D32" font-weight="700" text-anchor="middle">✔ executado</text><text x="795" y="672" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">sirene acionada</text><polyline points="922,656 968,656" fill="none" stroke="#2F3C7E" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="970" y="628" width="250" height="56" rx="28" fill="#F4F6FB" stroke="#8A93AD" stroke-width="2"/><text x="1095" y="652" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#5B6275" font-weight="700" text-anchor="middle">… confirmado</text><text x="1095" y="672" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" fill="#5B6275" font-weight="400" text-anchor="middle">estado refletido</text><text x="56" y="712" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#990011" font-weight="600" text-anchor="start">Rejeitado exemplo: “janela-01 · disparar — E_DESARMADO: sistema desarmado” (mostra o motivo, nunca “executado”).</text><text x="56" y="734" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#5B6275" font-weight="400" text-anchor="start">A tela só mostra “confirmado” depois que o dispositivo publica o estado; sem resposta em 10 s → “sem resposta”.</text></svg>
