# Mosquitto do compose. O passwd é gerado na subida a partir do .env (ver entrypoint.sh).

# MQTT puro: backend (rede interna do compose) e dispositivos na LAN/Tailscale.
listener 1883
protocol mqtt

# WebSocket: o nginx do host termina o TLS (wss:// na 443) e repassa para cá.
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
