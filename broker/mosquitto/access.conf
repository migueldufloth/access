# MQTT puro: LAN e Tailscale. Nao exposto a internet (roteador nao encaminha).
listener 1883 0.0.0.0
protocol mqtt

# WebSocket: apenas loopback, o nginx faz o proxy do wss:// da 443.
listener 9001 127.0.0.1
protocol websockets

allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# log_dest ja definido em /etc/mosquitto/mosquitto.conf:13 - duplicar e erro fatal
log_type all
