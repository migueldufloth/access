limit_req_zone  $binary_remote_addr zone=mqtt_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mqtt_conn:10m;
limit_req_zone  $binary_remote_addr zone=api_req:10m rate=20r/s;

server {
    listen 80;
    server_name accessgrupo5.duckdns.org;

    # precisa vir antes do redirect, senao a renovacao do certbot quebra
    location /.well-known/acme-challenge/ { root /var/www/access; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name accessgrupo5.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/accessgrupo5.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accessgrupo5.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Interface, API e binarios de OTA: backend do compose
    location / {
        limit_req zone=api_req burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MQTT sobre WebSocket das placas: Mosquitto do compose
    location /mqtt {
        limit_req  zone=mqtt_req burst=20 nodelay;
        limit_conn mqtt_conn 10;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # WebSocket e conexao longa; manter acima do keepalive do MQTT
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
