name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes do backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: access
          POSTGRES_PASSWORD: access
          POSTGRES_DB: access_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U access" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
        env:
          TEST_DATABASE_URL: postgresql://access:access@localhost:55432/access_test

  sistema:
    name: Sistema completo (docker compose + dispositivos simulados)
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar .env de teste com senhas aleatórias
        run: |
          cp .env.example .env
          for v in POSTGRES_PASSWORD MQTT_SENHA_BACKEND MQTT_SENHA_PORTA_01 MQTT_SENHA_JANELA_01 ADMIN_SENHA OPERADOR_SENHA JWT_SECRET; do
            sed -i "s|^$v=.*|$v=$(openssl rand -hex 24)|" .env
          done
      - name: Subir broker, backend e banco com um comando
        run: docker compose up -d --build --wait
      - run: pip install -r backend/requirements.txt
      - name: Verificar ponta a ponta
        working-directory: backend
        run: python -m tools.verificar_sistema
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
